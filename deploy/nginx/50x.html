<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servicio temporalmente no disponible</title>
    <link href="/static/dist/css/tabler.min.css" rel="stylesheet" />
    <script>
        (function () {
            try {
                var t = new URLSearchParams(window.location.search).get('theme') || localStorage.getItem('tabler-theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', t === 'dark' ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>
    <style>
        /* Respaldo mínimo si Tabler no carga (app/estáticos no disponibles). */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .page-center { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container-tight { width: 100%; max-width: 30rem; padding: 0 1rem; margin: 0 auto; }
        .empty { text-align: center; padding: 2rem 0; }
        .empty-img { margin: 0 0 1rem; line-height: 1; }
        .empty-img img { height: 8rem; max-width: 100%; width: auto; }
        .empty-title { font-size: 1.25rem; line-height: 1.4; margin: 0 0 .5rem; }
        .empty-subtitle { margin: 0 auto 1.5rem; max-width: 30rem; }
    </style>
  </head>
  <body class="border-top-wide border-primary d-flex flex-column">
    <div class="page page-center">
      <div class="container-tight py-4">
        <div class="empty">
          <div class="empty-img">
            <img src="/static/dist/img/webp/maintenance.webp"
                 height="128"
                 alt="Servicio no disponible"
                 onerror="this.style.display='none'" />
          </div>
          <p class="empty-title">El portal se está reiniciando</p>
          <p class="empty-subtitle text-muted">
            El servicio no está disponible en este momento por un reinicio o una actualización.
            Volverá a estar disponible en breve; esta página se actualizará automáticamente.
          </p>
        </div>
      </div>
    </div>
    <script>
        (function () {
            var RETRY_MS = 5000;
            var subtitle = document.querySelector('.empty-subtitle');
            var seconds = Math.ceil(RETRY_MS / 1000);
            function tick() {
                if (!subtitle) return;
                subtitle.textContent = 'El servicio no está disponible en este momento por un reinicio o una actualización. Volverá a estar disponible en breve; reintentando en ' + seconds + ' s…';
                if (seconds <= 0) {
                    window.location.reload();
                    return;
                }
                seconds -= 1;
                window.setTimeout(tick, 1000);
            }
            window.setTimeout(tick, 1000);
        })();
    </script>
  </body>
</html>
